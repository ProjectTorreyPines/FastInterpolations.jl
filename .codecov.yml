codecov:
  notify:
    after_n_builds: 6

coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 1%
    patch:
      default:
        target: 95%

ignore:
  - "ext/FastInterpolationsEnzymeExt.jl"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  after_n_builds: 6
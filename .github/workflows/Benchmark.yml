name: Benchmark

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      push_results:
        description: 'Push results to gh-pages'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: write

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'

      - name: Run benchmarks
        run: julia --project=benchmark benchmark/ci_benchmark.jl

      - name: Save PR metadata
        if: github.event_name == 'pull_request'
        run: |
          echo "${{ github.event.number }}" > pr_number
          echo "${{ github.event.pull_request.head.sha }}" > pr_head_sha

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            output.json
            pr_number
            pr_head_sha

      - name: Store benchmark result (push only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_results == true)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: FastInterpolations.jl Benchmarks
          tool: 'julia'
          output-file-path: output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench

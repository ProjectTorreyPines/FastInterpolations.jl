name: Benchmark Comment

on:
  workflow_run:
    workflows: ["Benchmark"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post Benchmark Comment
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR info
        id: pr-info
        run: |
          if [ -f pr_number ]; then
            echo "pr_number=$(cat pr_number)" >> $GITHUB_OUTPUT
            echo "pr_sha=$(cat pr_head_sha)" >> $GITHUB_OUTPUT
          else
            echo "::error::PR metadata not found in artifact"
            exit 1
          fi

      - name: Fetch previous benchmark data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/contents/bench/data.js \
            --header 'Accept: application/vnd.github.raw+json' \
            -q '.' > data.js 2>/dev/null || echo "" > data.js

      - name: Generate and post benchmark comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          PR_SHA: ${{ steps.pr-info.outputs.pr_sha }}
        run: |
          # Parse current benchmark results
          cat > format_bench.py << 'PYEOF'
          import json, sys, re

          # Read current benchmarks
          with open("output.json") as f:
              current = json.load(f)

          # Read previous benchmarks from gh-pages data.js
          previous = {}
          try:
              with open("data.js") as f:
                  content = f.read()
              if content.strip():
                  # Extract JSON from: window.BENCHMARK_DATA = {...}
                  match = re.search(r'window\.BENCHMARK_DATA\s*=\s*({.*})', content, re.DOTALL)
                  if match:
                      data = json.loads(match.group(1))
                      entries = data.get("entries", {})
                      for bench_name, runs in entries.items():
                          if runs:
                              latest = runs[-1]
                              for b in latest.get("benches", []):
                                  previous[b["name"]] = b
          except Exception:
              pass

          pr_sha = sys.argv[1][:8] if len(sys.argv) > 1 else "current"

          # Build markdown table
          rows = []
          for bench in current:
              name = bench["name"]
              cur_val = bench["value"]
              unit = bench.get("unit", "ns")
              prev_bench = previous.get(name)
              if prev_bench:
                  prev_val = prev_bench["value"]
                  ratio = cur_val / prev_val if prev_val > 0 else 0
                  rows.append(f"| `{name}` | `{cur_val}` {unit} | `{prev_val}` {unit} | `{ratio:.2f}` |")
              else:
                  rows.append(f"| `{name}` | `{cur_val}` {unit} | - | - |")

          header = f"# FastInterpolations.jl Benchmarks\n\n<details>\n\n"
          header += f"| Benchmark suite | Current: {pr_sha} | Previous | Ratio |\n"
          header += "|-|-|-|-|\n"
          footer = "\n</details>\n\n"
          footer += "This comment was automatically generated by [Benchmark workflow]"
          footer += f"(https://github.com/{sys.argv[2]}/actions?query=workflow%3ABenchmark).\n"

          body = header + "\n".join(rows) + footer
          with open("comment_body.md", "w") as f:
              f.write(body)
          PYEOF

          python3 format_bench.py "$PR_SHA" "${{ github.repository }}"

          # Post comment on the PR (update existing or create new)
          COMMENT_TAG="<!-- benchmark-comment -->"
          BODY="${COMMENT_TAG}
          $(cat comment_body.md)"

          # Check for existing benchmark comment
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${COMMENT_TAG}\")) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$BODY"
          fi

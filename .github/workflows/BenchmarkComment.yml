name: Benchmark Comment

on:
  workflow_run:
    workflows: ["Benchmark"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post Benchmark Comment
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch')

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR info
        id: pr-info
        run: |
          if [ -f pr_number ]; then
            echo "pr_number=$(cat pr_number)" >> $GITHUB_OUTPUT
            echo "pr_sha=$(cat pr_head_sha)" >> $GITHUB_OUTPUT
            echo "has_pr=true" >> $GITHUB_OUTPUT
          else
            echo "No PR metadata in artifact (non-PR run) -> nothing to comment"
            echo "has_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate benchmark comment
        if: steps.pr-info.outputs.has_pr == 'true'
        env:
          PR_SHA: ${{ steps.pr-info.outputs.pr_sha }}
        run: |
          PR_SHORT="${PR_SHA:0:8}"

          MK=$( [ -f machine_key.txt ] && cat machine_key.txt || echo "unknown" )
          CPU=$( [ -f hardware.json ] && cat hardware.json || echo '{}' )

          # Machine whose numbers the previous comment displayed (for a change
          # note), read from the v2 blob we carried forward. Only meaningful on
          # the same commit — the read step drops the blob on a SHA change.
          PREV_SHOWN=""
          if [ -s prev_blob.json ] && jq -e '.v==2' prev_blob.json >/dev/null 2>&1; then
            PREV_SHOWN=$(jq -r '.shown // ""' prev_blob.json)
          fi

          # CPU of master's most-recent commit — the baseline the ratios stand
          # next to. When it differs from this runner the comparison is cross-CPU
          # and unreliable; "unknown" means that master point had no fingerprint.
          # (Compare the string directly, not .baseline_same — jq's `// true`
          # would turn a genuine `false` into `true` and silence the warning.)
          BASE_MACHINE=""
          if [ -f regression_report.json ]; then
            BASE_MACHINE=$(jq -r '.machine.baseline // ""' regression_report.json)
          fi

          # This run's slice: the current machine's (min-merged) numbers + flags.
          CUR=""
          if [ -f regression_report.json ]; then
            CUR=$(jq -c '{benches: [.benchmarks[] | {name, value}], flagged: [.benchmarks[] | select(.was_flagged == true) | .name]}' regression_report.json)
          elif [ -f benchmark_flat.json ]; then
            CUR=$(jq -c '{benches: [.[] | {name, value}], flagged: []}' benchmark_flat.json)
          fi

          # Hidden machine-readable blob (v2): best times keyed BY MACHINE. The
          # next re-run reads back this machine's slice to min-merge; other
          # machines' floors are preserved so a fleet flip never discards them.
          BENCH_DATA=""
          if [ -n "$CUR" ]; then
            BASE='{"v":2,"machines":{}}'
            if [ -s prev_blob.json ] && jq -e '.v==2' prev_blob.json >/dev/null 2>&1; then
              BASE=$(cat prev_blob.json)
            fi
            BENCH_DATA=$(printf '%s' "$BASE" | jq -c \
              --arg mk "$MK" --arg sha "$PR_SHA" --argjson cur "$CUR" --argjson cpu "$CPU" \
              '.v = 2 | .sha = $sha | .shown = $mk | .machines[$mk] = ($cur + {cpu: $cpu})')
          fi

          {
            echo "<!-- benchmark-comment -->"
            if [ -n "$BENCH_DATA" ]; then
              echo "<!-- BENCH_DATA:${BENCH_DATA} -->"
            fi
            echo "# FastInterpolations.jl Benchmarks"
            echo ""

            # PRIMARY warning: the regression baseline (master's latest commit)
            # was measured on a different CPU than this PR — a cross-CPU ratio is
            # unreliable. Fires on a real mismatch AND on an unfingerprinted
            # ("unknown") master point.
            if [ -n "$BASE_MACHINE" ] && [ "$BASE_MACHINE" != "$MK" ]; then
              echo "> ## :rotating_light: Regression baseline is a different CPU"
              echo "> "
              echo "> | | CPU |"
              echo "> |---|---|"
              echo "> | **This PR run** | \`$MK\` |"
              echo "> | **Master baseline (latest commit)** | \`$BASE_MACHINE\` |"
              echo "> "
              echo "> The **Previous / Imm. Ratio / Grad. Ratio** columns compare against master history, but master's most recent commit was benchmarked on a **different CPU** — so a naive comparison is cross-CPU and unreliable. The ratios below use only same-\`$MK\` history and are blank if master has none on this CPU yet."
              echo ""
            fi

            # Secondary (nice-to-have): the previous COMMENT's numbers were from a
            # different CPU than this run. Compact one-liner.
            if [ -n "$PREV_SHOWN" ] && [ "$PREV_SHOWN" != "$MK" ]; then
              echo "> :information_source: The previous comment's numbers were measured on \`$PREV_SHOWN\`; this run is \`$MK\`. Each CPU keeps its own min-merge floor."
              echo ""
            fi

            if [ -f regression_report.json ]; then
              # ── Rich report from regression verification ──
              TOTAL=$(jq '.summary.total' regression_report.json)
              FLAGGED=$(jq '.summary.initially_flagged' regression_report.json)
              CONFIRMED=$(jq '.summary.confirmed_regressions' regression_report.json)
              RERUN_N=$(jq '.thresholds.rerun_n' regression_report.json)
              IMM_TH=$(jq '.thresholds.immediate' regression_report.json)
              GRAD_TH=$(jq '.thresholds.gradual' regression_report.json)

              # All benchmarks table (collapsed)
              echo "<details>"
              echo "<summary>All benchmarks (${TOTAL} total, click to expand)</summary>"
              echo ""
              echo "| Benchmark | Current: ${PR_SHORT} | Previous | Imm. Ratio | Grad. Ratio |"
              echo "|-----------|---------------------:|----------:|-----------:|------------:|"
              jq -r '.benchmarks[] |
                "| `\(.name)` | `\((.value * 100 | round) / 100)` ns | `\(.prev_value // "-")` ns | `\(.ratio_immediate // "-")` | `\(.ratio_gradual // "-")` |"
              ' regression_report.json
              echo ""
              echo "</details>"

              # Verification summary
              if [ "$CONFIRMED" -gt 0 ]; then
                echo ""
                echo "## :warning: **Performance Regression Confirmed** :warning:"
                echo ""
                echo "After re-running ${FLAGGED} flagged benchmark(s) ${RERUN_N} time(s), **${CONFIRMED} regression(s) confirmed**."
                echo ""
                echo "| Benchmark | Current | Previous | Imm. Ratio | Grad. Ratio | Tier |"
                echo "|-----------|--------:|----------:|-----------:|------------:|------|"
                jq -r '.benchmarks[] | select(.regression == true) |
                  "| `\(.name)` | `\((.value * 100 | round) / 100)` ns | `\(.prev_value // "-")` ns | `\(.ratio_immediate // "-")` | `\(.ratio_gradual // "-")` | \(if .ratio_immediate != null and .ratio_immediate > '"$IMM_TH"' then (if .ratio_gradual != null and .ratio_gradual > '"$GRAD_TH"' then "both" else "immediate" end) else "gradual" end) |"
                ' regression_report.json
                echo ""
                echo "> Thresholds: immediate > ${IMM_TH}x (vs latest master), gradual > ${GRAD_TH}x (vs sliding window)"
              elif [ "$FLAGGED" -gt 0 ]; then
                echo ""
                echo "> :white_check_mark: **${FLAGGED} benchmark(s) were flagged but verified as CI noise after ${RERUN_N} re-run(s)**"
              else
                echo ""
                echo "> :white_check_mark: No regressions detected"
              fi

            elif [ -f benchmark_flat.json ]; then
              # ── Fallback: no regression report (no baseline available) ──
              echo "<details>"
              echo "<summary>All benchmarks (click to expand)</summary>"
              echo ""
              echo "| Benchmark | Current: ${PR_SHORT} |"
              echo "|-----------|---------------------:|"
              jq -r '.[] | "| `\(.name)` | `\(.value)` \(.unit) |"' benchmark_flat.json
              echo ""
              echo "</details>"
              echo ""
              echo "> No baseline data available for comparison (first benchmark run?)"

            else
              echo "> No benchmark data found in artifacts"
            fi

            if [ -f hardware.json ]; then
              echo ""
              echo "> Runner: \`$MK\` — $(jq -r '.model' hardware.json), julia $(jq -r '.julia' hardware.json). Times are min-merged and compared only against this same machine's history."
            fi

            echo ""
            echo "This comment was automatically generated by [Benchmark workflow](https://github.com/${{ github.repository }}/actions?query=workflow%3ABenchmark)."
          } > comment_body.md

      - name: Post or update PR comment
        if: steps.pr-info.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
        run: |
          COMMENT_TAG="<!-- benchmark-comment -->"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${COMMENT_TAG}\")) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH -F body=@comment_body.md
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file comment_body.md
          fi

name: Benchmark Comment

on:
  workflow_run:
    workflows: ["Benchmark"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Post Benchmark Comment
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR info
        id: pr-info
        run: |
          if [ -f pr_number ]; then
            echo "pr_number=$(cat pr_number)" >> $GITHUB_OUTPUT
            echo "pr_sha=$(cat pr_head_sha)" >> $GITHUB_OUTPUT
          else
            echo "::error::PR metadata not found in artifact"
            exit 1
          fi

      - name: Fetch previous benchmark data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/contents/bench/data.js?ref=gh-pages" \
            --header 'Accept: application/vnd.github.raw+json' \
            > data.js 2>/dev/null || echo "" > data.js

      - name: Generate and post benchmark comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          PR_SHA: ${{ steps.pr-info.outputs.pr_sha }}
        run: |
          ALERT_THRESHOLD="1.20"

          # Extract previous benchmark values from gh-pages data.js
          if [ -s data.js ]; then
            sed 's/^window\.BENCHMARK_DATA = //' data.js | sed 's/;$//' | \
              jq '[.entries | to_entries[0].value[-1].benches[] | {(.name): .value}] | add // {}' \
              > prev_map.json 2>/dev/null || echo "{}" > prev_map.json
          else
            echo "{}" > prev_map.json
          fi

          # Build table rows and collect alert rows
          PR_SHORT="${PR_SHA:0:8}"
          ALL_ROWS=""
          ALERT_ROWS=""
          HAS_WARNING=false

          while IFS=$'\t' read -r name value unit; do
            prev_val=$(jq -r --arg n "$name" '.[$n] // empty' prev_map.json)
            if [ -n "$prev_val" ] && [ "$prev_val" != "null" ]; then
              ratio=$(echo "scale=2; $value / $prev_val" | bc 2>/dev/null || echo "-")
              row="| \`${name}\` | \`${value}\` ${unit} | \`${prev_val}\` ${unit} | \`${ratio}\` |"
              ALL_ROWS="${ALL_ROWS}${row}
          "
              if [ "$ratio" != "-" ] && [ "$(echo "$ratio > $ALERT_THRESHOLD" | bc -l 2>/dev/null)" = "1" ]; then
                ALERT_ROWS="${ALERT_ROWS}${row}
          "
                HAS_WARNING=true
              fi
            else
              ALL_ROWS="${ALL_ROWS}| \`${name}\` | \`${value}\` ${unit} | - | - |
          "
            fi
          done < <(jq -r '.[] | "\(.name)\t\(.value)\t\(.unit)"' benchmark_flat.json)

          # Build comment body
          HEADER="| Benchmark suite | Current: ${PR_SHORT} | Previous | Ratio |
          |-|-|-|-|"
          {
            echo "<!-- benchmark-comment -->"
            echo "# FastInterpolations.jl Benchmarks"
            echo ""
            echo "<details>"
            echo ""
            echo "$HEADER"
            printf '%s' "$ALL_ROWS"
            echo ""
            echo "</details>"

            if [ "$HAS_WARNING" = true ]; then
              echo ""
              echo "# :warning: **Performance Alert** :warning:"
              echo ""
              echo "Possible performance regression was detected for benchmark **'FastInterpolations.jl Benchmarks'**."
              echo "Benchmark result of this commit is worse than the previous benchmark result exceeding threshold \`${ALERT_THRESHOLD}\`."
              echo ""
              echo "$HEADER"
              printf '%s' "$ALERT_ROWS"
            fi

            echo ""
            echo "This comment was automatically generated by [Benchmark workflow](https://github.com/${{ github.repository }}/actions?query=workflow%3ABenchmark)."
          } > comment_body.md

          # Post or update comment on PR
          COMMENT_TAG="<!-- benchmark-comment -->"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${COMMENT_TAG}\")) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING}" \
              -X PATCH -F body=@comment_body.md
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file comment_body.md
          fi

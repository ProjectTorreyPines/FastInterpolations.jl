name: CI

on:
  push:
    branches:
      - master
    tags: ["*"]
  pull_request:
    paths:
      - "src/**"
      - "ext/**"
      - "test/**"
      - "Project.toml"
      - ".github/workflows/CI.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.x"
          - "lts"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - name: Enable AdaptiveArrayPools runtime checks
        run: |
          echo '[AdaptiveArrayPools]' > LocalPreferences.toml
          echo 'runtime_check = true' >> LocalPreferences.toml

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        env:
          SKIP_EXTENSIONS: "true"
          JULIA_LOAD_PATH: "@:@v#.#:@stdlib:."

      - name: Thread Safety Tests (2 threads)
        run: julia --project -e 'using Pkg; Pkg.test(; coverage=true, julia_args=["-t", "2"], test_args=["test_thread_safety.jl"])'
        env:
          JULIA_LOAD_PATH: "@:@v#.#:@stdlib:."

      - name: Thread Safety Tests (Oversubscribe with 16 threads)
        run: julia --project -e 'using Pkg; Pkg.test(; coverage=true, julia_args=["-t", "16"], test_args=["test_thread_safety.jl"])'
        env:
          JULIA_LOAD_PATH: "@:@v#.#:@stdlib:."

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-extensions:
    name: Extensions - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.x"
          - "lts"

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - name: Enable AdaptiveArrayPools runtime checks
        run: |
          echo '[AdaptiveArrayPools]' > LocalPreferences.toml
          echo 'runtime_check = true' >> LocalPreferences.toml

      - uses: julia-actions/julia-buildpkg@v1

      - name: Extension Tests (AD / Recipes / Symbolics)
        run: julia --project -e 'using Pkg; Pkg.test(; coverage=true, test_args=["ext/runtests.jl"])'
        env:
          JULIA_LOAD_PATH: "@:@v#.#:@stdlib:."

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

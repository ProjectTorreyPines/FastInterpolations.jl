name: CI (parallel experiment)

# Experimental REPLICA of CI.yml with the main @testitem suite run in PARALLEL.
# The ONLY difference from CI.yml: RETESTITEMS_NWORKERS routes test/runtests.jl
# through ReTestItems worker processes (see test/runtests_parallel.jl). The suite
# still runs under Pkg.test via julia-runtest, so the sandbox (this checkout
# auto-dev'd), --check-bounds=yes, and package-scoped coverage are all identical
# to the sequential CI. Runs only on workflow_dispatch / ci/retest pushes — never
# master or PRs. Promote by adding the env var to CI.yml once proven.
on:
  workflow_dispatch:
    inputs:
      nworkers:
        description: "Override workers for ALL jobs (blank = per-OS default: ubuntu/windows 4, macos 3)"
        default: ""
  push:
    branches:
      - ci/retest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}     # public repo: ubuntu/windows = 4 vCPUs, macos = 3
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ["1.x", "lts"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            nworkers: 4
            precompile_tasks: 4
          - os: macos-latest
            nworkers: 3
            precompile_tasks: 2    # 7 GB runner: 3 concurrent Enzyme-class precompiles swap-storm
          - os: windows-latest
            nworkers: 4
            precompile_tasks: 4

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      # Identical to CI.yml's test step except RETESTITEMS_NWORKERS, which flips
      # test/runtests.jl to the parallel path.
      - uses: julia-actions/julia-runtest@v1
        env:
          SKIP_EXTENSIONS: "true"
          RETESTITEMS_NWORKERS: ${{ github.event.inputs.nworkers || matrix.nworkers }}
          JULIA_NUM_PRECOMPILE_TASKS: ${{ matrix.precompile_tasks }}

      # Thread-safety — identical to CI.yml, multi-threaded in ONE process (bumped 2 → 4).
      # RETESTITEMS_NWORKERS is unset here, so these take the sequential TestItemRunner path.
      - name: Thread Safety Tests (4 threads)
        run: julia --color=yes --project -e 'using Pkg; Pkg.test(; coverage=true, julia_args=["-t", "4"], test_args=["test_thread_safety.jl"])'

      - name: Thread Safety Tests (Oversubscribe with 16 threads)
        run: julia --color=yes --project -e 'using Pkg; Pkg.test(; coverage=true, julia_args=["-t", "16"], test_args=["test_thread_safety.jl"])'

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-extensions:
    name: Extensions - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ["1.x", "lts"]

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      # Extension tests are legacy @testset (not @testitem), so the parallel path
      # never touches them — run them exactly as CI.yml does, in their own process.
      - name: Extension Tests (AD / Recipes / Symbolics)
        run: julia --color=yes --project -e 'using Pkg; Pkg.test(; coverage=true, test_args=["ext/runtests.jl"])'

      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

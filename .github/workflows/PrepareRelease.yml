name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      skip_benchmark:
        description: 'Skip benchmark plot generation'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from Project.toml
        id: version
        run: |
          VERSION=$(grep '^version' Project.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Current version: $VERSION"

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      # ──────────────────────────────────────────────────────────────
      # Benchmark plot generation (optional)
      # ──────────────────────────────────────────────────────────────
      - name: Add registries
        if: ${{ !inputs.skip_benchmark }}
        run: |
          julia -e 'using Pkg
            Pkg.Registry.add(RegistrySpec(url="https://github.com/ProjectTorreyPines/FuseRegistry.jl.git"))
            Pkg.Registry.add("General")
            Pkg.Registry.update()'

      - name: Install benchmark dependencies
        if: ${{ !inputs.skip_benchmark }}
        run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'

      - name: Generate benchmark plot
        if: ${{ !inputs.skip_benchmark }}
        run: julia --project=benchmark benchmark/run_readme_benchmark.jl

      - name: Update benchmark versions in README
        if: ${{ !inputs.skip_benchmark }}
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract package versions using Julia and update README directly
          julia --project=benchmark -e '
            using Pkg

            # Helper to get version from installed packages
            function get_pkg_version(name::String)
                deps = Pkg.dependencies()
                for (uuid, info) in deps
                    if info.name == name && info.version !== nothing
                        return string(info.version)
                    end
                end
                return "?"
            end

            itp_ver = get_pkg_version("Interpolations")
            di_ver = get_pkg_version("DataInterpolations")
            pkg_ver = ENV["PKG_VERSION"]
            julia_ver = "$(VERSION.major).$(VERSION.minor).$(VERSION.patch)"

            println("Versions: FastInterpolations v$pkg_ver, Interpolations v$itp_ver, DataInterpolations v$di_ver, Julia $julia_ver")

            # Build new content block (no leading whitespace)
            new_content = "<!-- BENCHMARK_VERSIONS_START -->\n" *
                "> **Env:** GitHub Actions · \`ubuntu-latest\` · Julia $julia_ver<br>\n" *
                "> **Pkg:** FastInterpolations (v$pkg_ver) · Interpolations (v$itp_ver) · DataInterpolations (v$di_ver)\n" *
                "<!-- BENCHMARK_VERSIONS_END -->"

            # Read README
            readme = read("README.md", String)

            # Replace content between markers
            pattern = r"<!-- BENCHMARK_VERSIONS_START -->.*?<!-- BENCHMARK_VERSIONS_END -->"s
            new_readme = replace(readme, pattern => new_content)

            # Write back
            write("README.md", new_readme)
            println("Updated README with new benchmark versions")
          '

          echo "Updated README:"
          grep -A3 "BENCHMARK_VERSIONS_START" README.md

      # ──────────────────────────────────────────────────────────────
      # Commit and push
      # ──────────────────────────────────────────────────────────────
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/ README.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update benchmark for v${{ steps.version.outputs.version }}"
            git push
            echo "✅ Changes committed and pushed"
          fi

      # ──────────────────────────────────────────────────────────────
      # Summary
      # ──────────────────────────────────────────────────────────────
      - name: Print next steps
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  ✅ Release v${{ steps.version.outputs.version }} prepared!"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "  📋 Next steps:"
          echo ""
          echo "  1. Go to the latest commit on master branch"
          echo "  2. Comment: @JuliaRegistrator register"
          echo "  3. Wait for Registry PR to be created and merged"
          echo "  4. TagBot will automatically create the git tag"
          echo ""
          echo "════════════════════════════════════════════════════════════"

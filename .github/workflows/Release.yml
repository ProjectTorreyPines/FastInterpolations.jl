name: Release

on:
  workflow_dispatch:
    inputs:
      skip_register:
        description: 'Skip JuliaRegistrator call (manual registration)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Run Benchmark & Update README (Standalone Logic)
  # ──────────────────────────────────────────────────────────────
  benchmark:
    uses: ./.github/workflows/UpdateREADME.yml

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Finalize Release (Commit & Register)
  # ──────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Pre-release checks
      # ----------------------------------------------------
      - name: Check branch is master
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" != "master" ] && [ "$BRANCH" != "main" ]; then
            echo "❌ Release must be run from master/main branch"
            exit 1
          fi

      - name: Read version from Project.toml
        id: version
        run: |
          VERSION=$(grep '^version' Project.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Release Version: $VERSION"

      - name: Check tag does not exist
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          git fetch --tags
          if git tag -l | grep -q "^${VERSION}$"; then
            echo "❌ Tag $VERSION already exists!"
            exit 1
          fi
          echo "✅ Tag $VERSION is available"

      - name: Check release notes exist
        id: release_notes
        run: |
          NOTES_FILE="docs/release_notes/v${{ steps.version.outputs.version }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "✅ Release notes found: $NOTES_FILE"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ No custom release notes found (TagBot will auto-generate)"
          fi

      # ----------------------------------------------------
      # Restore Benchmark Results
      # ----------------------------------------------------
      - name: Download Benchmark Results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          # Downloads to current directory (overwriting README.md and docs/images/)

      - name: Verify Artifacts
        run: |
          ls -l README.md
          ls -l docs/images/benchmark_oneshot_detail.png
          echo "✅ Benchmark artifacts restored"

      # ----------------------------------------------------
      # Commit & Push
      # ----------------------------------------------------
      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force add updated files
          git add docs/images/ README.md

          if git diff --staged --quiet; then
            echo "No changes to commit (Strange for a benchmark update...)"
            echo "committed=false" >> $GITHUB_OUTPUT
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            git commit -m "Update benchmark for v${{ steps.version.outputs.version }}"
            git push origin HEAD:master
            echo "✅ Changes committed and pushed"
            echo "committed=true" >> $GITHUB_OUTPUT
            echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------------------
      # Registration
      # ----------------------------------------------------
      - name: Prepare registration comment
        if: ${{ !inputs.skip_register }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="docs/release_notes/v${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            BODY="@JuliaRegistrator register

          Release notes:

          $(cat "$NOTES_FILE")"
          else
            BODY="@JuliaRegistrator register"
          fi

          echo "$BODY" > /tmp/comment_body.txt

      - name: Call JuliaRegistrator
        if: ${{ !inputs.skip_register }}
        uses: peter-evans/commit-comment@v3
        with:
          sha: ${{ steps.commit.outputs.sha }}
          body-path: /tmp/comment_body.txt

      - name: Summary
        run: |
          echo "🚀 Release Process Complete!"
          if [ "${{ inputs.skip_register }}" == "true" ]; then
            echo "⚠️ Registration skipped (manual mode)"
          else
            echo "✅ JuliaRegistrator called"
          fi

